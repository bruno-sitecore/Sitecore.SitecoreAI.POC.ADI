    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><p>As AI workloads accelerate, the shift toward AI factories are driving unprecedented rack-level power density. At the center of this transition is <strong style="border-width:0px;box-sizing:border-box;font-size:16px;margin:0px;padding:0px;vertical-align:baseline;">NVIDIA MGX™</strong>, an open modular architecture that enables faster system design, improved scalability and rapid deployment of next-generation AI infrastructure.</p><p>As a valued member of the MGX ecosystem, Analog Devices, Inc. (ADI) is working alongside NVIDIA to help enable this transformation, delivering the power technologies required to support increasingly demanding AI factory deployments.</p><p><img style="border-width:0px;box-sizing:border-box;font-size:16px;margin:0px;max-width:100%;padding:0px;vertical-align:baseline;" src="https://www.analog.com/en/_/media/analog/en/about-adi/newsroom/carousel/800v-hotswap-800v-6-v-5-28-2026pr.jpg" alt="800v hotswap 800v 6 v 5 28 2026pr" width="754" height="246" _languageinserted="true" /></p><p><strong style="border-width:0px;box-sizing:border-box;font-size:16px;margin:0px;padding:0px;vertical-align:baseline;">The Shift to 800 VDC: Enabling AI Factory Scale</strong><br />As AI factories push for ever-higher performance, traditional 48 V architectures can no longer sustain the power demands of modern GPU clusters. To keep performance scaling, MGX-based AI factories are moving to 800 VDC rack-level architectures, which reduce current and power losses, enable more compact distribution and support scalable designs targeting megawatt-class racks. This shift in power architecture is foundational for future NVIDIA platforms where continued performance gains depend directly on power delivery efficiency.</p></div>
