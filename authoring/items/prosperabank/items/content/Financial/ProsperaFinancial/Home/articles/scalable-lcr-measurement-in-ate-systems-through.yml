    Value: "Scalable LCR Measurement in ATE Systems Through Probe-Card-Level Integration"
  Versions:
  - Version: 2
    Fields:
    - ID: "001dd393-96c5-490b-924a-b0f25cd9efd8"
      Hint: __Lock
      Value: <r />
    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><h2 style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font:600 32px / 40px barlow, sans-serif;letter-spacing:normal;margin-bottom:19px;margin-top:33px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Abstract</h2><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Semiconductor testing is moving toward higher complexity and parallelism, increasing the need for inductance, capacitance, and resistance (LCR) measurements in high-site-count automatic test equipment (ATE) and SiC/GaN testing. However, external bench-top LCR meters and cable-based setups are difficult to scale and can reduce repeatability. This article introduces an embedded, modular LCR approach and a probe-card integration case enabling scalable, parallel LCR testing, with an outlook on future ATE applications.</p><h2 style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font:600 32px / 40px barlow, sans-serif;letter-spacing:normal;margin-bottom:19px;margin-top:33px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Market Background and Application Trends</h2><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">In recent years, semiconductor test requirements have shifted toward higher complexity and higher parallelism, driven by advanced packaging adoption, increasing integration density, and growing need for power and signal integrity validation. As a result, wafer-level and package-level testing now includes more parametric characterization beyond basic pass/fail.</p><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Among these parametric needs, inductance, capacitance, and resistance (LCR) measurement has become increasingly important because it provides fast, quantitative impedance characterization of passive components and device structures. This trend is especially visible in automatic test equipment (ATE) environments, where customers push for higher site counts and faster throughput, creating demand to migrate traditionally bench-top measurements into scalable, production-ready architectures.</p><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">In Taiwan, the increasing adoption of wide-band-gap power devices such as silicon carbide (SiC) and gallium nitride (GaN) requires characterization of impedance-related parameters, including gate capacitance and turn-on resistance, which impact switching performance, efficiency, and reliability.</p><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">However, many ATE platforms do not natively support LCR measurements, so customers often rely on external bench-top LCR meters connected via cables and fixtures. This approach is typically single-site and difficult to scale, and long interconnect paths can reduce repeatability and increase integration overhead.</p></div>
