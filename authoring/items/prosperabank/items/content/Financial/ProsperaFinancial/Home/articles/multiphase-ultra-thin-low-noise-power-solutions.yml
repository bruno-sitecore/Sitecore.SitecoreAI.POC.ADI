  - ID: "b5e02ad9-d56f-4c41-a065-a133db87bdeb"
    Hint: __Display name
    Value: "Multiphase, Ultra-Thin, Low-Noise Power Solutions"
  Versions:
  - Version: 1
    Fields:
    - ID: "001dd393-96c5-490b-924a-b0f25cd9efd8"
      Hint: __Lock
      Value: <r />
    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: |
        <div class="ck-content"><h2 style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font:600 32px / 40px barlow, sans-serif;letter-spacing:normal;margin-bottom:19px;margin-top:33px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Abstract</h2><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Ultra-thin, low-noise multiphase power solutions are redefining what is possible in high-density electronic systems. By combining compact form factors with high-current capability, these solutions enable designers to meet demanding transient and efficiency requirements without sacrificing valuable board space. Advanced multiphase architectures support fast transient response, reduced output ripple, and improved thermal performance—a key advantage for applications where cooling is limited and signal integrity is paramount.</p><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">This article demonstrates a practical implementation using an ultra-thin, low-noise μModule® regulator. By leveraging multiphase interleaving and parallel operation, the solution achieves exceptionally low output noise and EMI while scaling output current up to 16A in a compact footprint. This approach is ideally suited for sensitive analog circuits, high-speed data interfaces, and densely packed PCBs in data center, 5G telecom, and industrial automation applications.</p><h2 style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font:600 32px / 40px barlow, sans-serif;letter-spacing:normal;margin-bottom:19px;margin-top:33px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Introduction</h2><p style="-webkit-text-stroke-width:0px;color:rgb(16, 24, 32);font-family:inter, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:16px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Modern electronic systems including cloud servers, telecom infrastructure, and advanced industrial automation demand higher performance within increasingly constrained form factors. As point-of-load current requirements rise and board real estate shrinks, designers must deliver robust, high-current solutions without compromising efficiency, noise performance, or signal integrity. At the same time, the proliferation of sensitive analog circuitry and high-speed data interfaces makes low noise and minimal electromagnetic interference (EMI) more critical than ever.</p></div>
